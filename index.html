<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion Voice Dialer</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #121212; color: white; }
        button { padding: 15px 30px; font-size: 18px; border: none; border-radius: 25px; background: #007bff; color: white; cursor: pointer; }
        button:hover { background: #0056b3; }
        #status { margin-top: 20px; font-size: 20px; color: #00ffcc; }
    </style>
</head>
<body>

    <h1>Orion Voice Assistant</h1>
    <p>Tap the button and say: <strong>"Orion call [Name]"</strong></p>
    <button id="start-btn">🎙️ Speak Now</button>
    <div id="status">Ready...</div>

    <script>
        // 1. Define your contact list (Websites cannot read phone contacts directly)
        const contacts = {

            "gomathi athai": "+919500556257",

            "siddharth": "+919884704216",
            "taraniya": "+919344811544",
            "kugaa": "+916381723630",
            "dhuvaragesh": "+919444065216",   
            "suriya anna" "+916374142151",
            "rebu": "+917358054540"  
        };

        const startBtn = document.getElementById('start-btn');
        const statusDiv = document.getElementById('status');

        // 2. Initialize Voice Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusDiv.innerText = "Error: Your browser does not support voice recognition.";
        } else {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';

            startBtn.addEventListener('click', () => {
                statusDiv.innerText = "Listening for 'Orion call...'";
                recognition.start();
            });

            recognition.onresult = (event) => {
                const command = event.results[0][0].transcript.toLowerCase().trim();
                statusDiv.innerText = `You said: "${command}"`;
                parseCommand(command);
            };

            recognition.onerror = () => {
                statusDiv.innerText = "Error trying to hear you. Try again.";
            };
        }

        // 3. Parse the Voice Command
        function parseCommand(command) {
            // Check if command starts with "orion call"
            if (command.startsWith("orion call")) {
                // Extract the name after "orion call "
                const name = command.replace("orion call", "").trim();
                
                if (contacts[name]) {
                    const phoneNumber = contacts[name];
                    statusDiv.innerText = `Calling ${name}...`;
                    
                    // 4. Trigger the native phone call
                    // Note: Browser security forces a system popup confirmation
                    window.location.href = `tel:${phoneNumber}`;
                } else {
                    statusDiv.innerText = `Contact "${name}" not found in Orion list.`;
                }
            } else {
                statusDiv.innerText = "Command not recognized. Say 'Orion call [Name]'.";
            }
        }
    </script>
</body>
</html>
